                const desc = place.desc[currentLang] || place.desc['el'];
                
                const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${place.lat},${place.lng}`;

        function appendMessage(sender, text) {
            const chatBox = document.getElementById('chat-box');
            if (!chatBox) return;

            const isUser = sender === 'user';
            const msgDiv = document.createElement('div');
            msgDiv.className = `flex ${isUser ? 'justify-end' : 'justify-start'} fade-in-img`;

                : "bg-white text-slate-800 p-3.5 rounded-2xl rounded-tl-none text-xs max-w-[85%] border border-slate-200/60 shadow-sm leading-relaxed space-y-2";

            let formattedText = escapeHtml(text).replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>');
            bubble.innerHTML = formattedText;

            msgDiv.appendChild(bubble);
            chatBox.appendChild(msgDiv);

        function speak(text) {
            if (!('speechSynthesis' in window)) return;
            try {
                window.speechSynthesis.cancel();
                const cleanText = text.replace(/[\*\#\_\-\•]/g, '');
                const utterance = new SpeechSynthesisUtterance(cleanText);
                utterance.lang = currentLang === 'el' ? 'el-GR' : (currentLang === 'en' ? 'en-US' : currentLang);
                
                const chosenVoice = getBestVoice(utterance.lang.substring(0, 2));
                if (chosenVoice) utterance.voice = chosenVoice;

                utterance.rate = 0.95;
                utterance.pitch = 1.0;
                window.speechSynthesis.speak(utterance);
            } catch (err) {
                console.error("Speech synthesis error:", err);
            }
        }

        function handleSend() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text) return;

            appendMessage('user', text);
            input.value = '';

            showTypingIndicator();
            setTimeout(() => {
                hideTypingIndicator();
                const reply = generateAIResponse(text);
                appendMessage('bot', reply);
                speak(reply);
            }, 600);
        }

            if (type === 'weather') userText = currentLang === 'el' ? 'Πώς είναι ο καιρός;' : 'How is the weather?';

            if (type === 'rules') userText = currentLang === 'el' ? 'Ποιοι είναι οι κανόνες;' : 'What are the house rules?';
            if (type === 'taxi') userText = currentLang === 'el' ? 'Χρειάζομαι ταξί.' : 'I need a taxi.';

            appendMessage('user', userText);

            setTimeout(() => {

                appendMessage('bot', reply);
                speak(reply);

        }

        function initVoiceRecognition() {
            const voiceBtn = document.getElementById('voice-btn');
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

            if (!SpeechRecognition) {
                voiceBtn.style.display = 'none';
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;

            voiceBtn.addEventListener('click', () => {
                unlockSpeech();
                recognition.lang = currentLang === 'el' ? 'el-GR' : (currentLang === 'en' ? 'en-US' : currentLang);
                try {
                    recognition.start();
                    voiceBtn.classList.add('bg-red-100', 'text-red-600', 'animate-pulse');
                } catch (e) {
                    recognition.stop();
                }
            });

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                document.getElementById('chat-input').value = transcript;
                voiceBtn.classList.remove('bg-red-100', 'text-red-600', 'animate-pulse');
                handleSend();
            };

            recognition.onerror = () => {
                voiceBtn.classList.remove('bg-red-100', 'text-red-600', 'animate-pulse');
            };

            recognition.onend = () => {
                voiceBtn.classList.remove('bg-red-100', 'text-red-600', 'animate-pulse');
            };
        }

                    handleSend();
                }
            });

            updateStaticTexts();
            initVoiceRecognition();

            setTimeout(() => {
                const welcome = uiTranslations[currentLang].welcomeMsg;
                appendMessage('bot', welcome);
            }, 300);
        });
    </script>
</body>
</html>
