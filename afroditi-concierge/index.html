        function unlockSpeech() {
            if (speechUnlocked) return;
            try {
                sharedAudio.src = SILENT_AUDIO_SRC;

                    // τη σημαία - θα ξαναδοκιμάσει στην επόμενη χειρονομία (χωρίς { once:true }).

        const imgFallback = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 176'%3E%3Crect width='400' height='176' fill='%23e2e8f0'/%3E%3Ctext x='50%25' y='50%25' font-size='40' text-anchor='middle' dominant-baseline='middle'%3E📷%3C/text%3E%3C/svg%3E";

        function renderPlaces() {
            const container = document.getElementById('places-container'); if (!container) return;
            container.innerHTML = '';
            const data = db[currentLang];

            data.categories.forEach((category, cIdx) => {
                const activeIdx = category.activeIndex; const activeOption = category.options[activeIdx];
                let distanceText = data.gpsFormat.replace('{dist}', activeOption.distKm).replace('{time}', activeOption.timeMin);

                // Λωρίδα εικόνων: όλες οι επιλογές σε μια σειρά, με οριζόντιο scroll αφής (swipe) + snap
                let imagesHtml = '';
                category.options.forEach((opt, oIdx) => {
                    imagesHtml += `<img src="${opt.image}" data-idx="${oIdx}" loading="lazy" onerror="this.onerror=null;this.src='${imgFallback}';" class="w-full h-44 object-cover shrink-0 snap-center fade-in-img" alt="${escapeHtml(opt.title)}">`;
                });

                let buttonsHtml = '';
                category.options.forEach((opt, oIdx) => {
                    buttonsHtml += `<button data-idx="${oIdx}" aria-label="${escapeHtml(opt.title)}" class="place-dot-btn ${oIdx === activeIdx ? 'px-3 py-1 text-xs font-bold rounded-full bg-[#4A5D23] text-white shadow-sm' : 'px-3 py-1 text-xs font-semibold rounded-full bg-slate-100 text-slate-600 hover:bg-slate-200'} transition">${oIdx + 1}</button>`;
                });

                container.innerHTML += `
                    <div class="bg-white rounded-2xl border border-slate-100 overflow-hidden shadow-sm">
                        <div class="w-full h-44 overflow-x-auto no-scrollbar flex snap-x snap-mandatory place-image-scroll" data-cat="${cIdx}">${imagesHtml}</div>
                        <div class="p-4">
                            <div class="flex gap-1.5 justify-center mb-3 pb-2 border-b border-slate-50 place-dots" data-cat="${cIdx}">${buttonsHtml}</div>
                            <div class="flex justify-between items-center mb-1">
                                <span class="text-[10px] font-bold text-[#4A5D23] uppercase tracking-wider">${escapeHtml(category.name)}</span>
                                <span class="text-xs font-semibold text-amber-500 place-rating" data-cat="${cIdx}">${activeOption.rating}</span>
                            </div>
                            <h4 class="font-bold text-slate-800 text-sm h-5 truncate place-title" data-cat="${cIdx}">${escapeHtml(activeOption.title)}</h4>
                            <p class="text-xs text-slate-500 mt-1 leading-relaxed h-12 overflow-hidden place-desc" data-cat="${cIdx}">${escapeHtml(activeOption.desc)}</p>
                            <div class="mt-3 pt-3 border-t border-slate-50 flex items-center justify-between text-[11px] font-semibold text-slate-400">
                                <span class="place-distance" data-cat="${cIdx}">${distanceText}</span>
                                <a href="${activeOption.url}" target="_blank" rel="noopener" class="text-[#4A5D23] font-bold hover:underline place-gps-link" data-cat="${cIdx}">${data.gpsNav}</a>
                            </div>
                        </div>
                    </div>
                `;
            });

            setupPlaceGalleries();
        }

        // Ενημερώνει μόνο το κείμενο/κουκίδες μιας κατηγορίας (ΧΩΡΙΣ πλήρες re-render,
        // ώστε να μη "πηδάει" το scroll των εικόνων ενώ ο επισκέπτης κάνει swipe)
        function updatePlaceInfo(cIdx) {
            const data = db[currentLang];
            const category = data.categories[cIdx];
            const activeOption = category.options[category.activeIndex];
            const distanceText = data.gpsFormat.replace('{dist}', activeOption.distKm).replace('{time}', activeOption.timeMin);

            const ratingEl = document.querySelector(`.place-rating[data-cat="${cIdx}"]`);
            const titleEl = document.querySelector(`.place-title[data-cat="${cIdx}"]`);
            const descEl = document.querySelector(`.place-desc[data-cat="${cIdx}"]`);
            const distEl = document.querySelector(`.place-distance[data-cat="${cIdx}"]`);
            const gpsEl = document.querySelector(`.place-gps-link[data-cat="${cIdx}"]`);

            if (ratingEl) ratingEl.textContent = activeOption.rating;
            if (titleEl) titleEl.textContent = activeOption.title;
            if (descEl) descEl.textContent = activeOption.desc;
            if (distEl) distEl.textContent = distanceText;
            if (gpsEl) gpsEl.href = activeOption.url;

            document.querySelectorAll(`.place-dots[data-cat="${cIdx}"] .place-dot-btn`).forEach((btn, i) => {
                btn.className = 'place-dot-btn transition ' + (i === category.activeIndex
                    ? 'px-3 py-1 text-xs font-bold rounded-full bg-[#4A5D23] text-white shadow-sm'
                    : 'px-3 py-1 text-xs font-semibold rounded-full bg-slate-100 text-slate-600 hover:bg-slate-200');
            });
        }

        // Συνδέει το swipe (IntersectionObserver) και τα κουμπιά-αριθμούς με τη λωρίδα εικόνων κάθε κατηγορίας
        function setupPlaceGalleries() {
            const data = db[currentLang];
            document.querySelectorAll('.place-image-scroll').forEach(scrollEl => {
                const cIdx = parseInt(scrollEl.dataset.cat, 10);
                const category = data.categories[cIdx];
                const images = Array.from(scrollEl.querySelectorAll('img'));

                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting && entry.intersectionRatio > 0.6) {
                            const idx = parseInt(entry.target.dataset.idx, 10);
                            if (idx !== category.activeIndex) {
                                category.activeIndex = idx;
                                updatePlaceInfo(cIdx);
                            }
                        }
                    });
                }, { root: scrollEl, threshold: [0.6] });

                images.forEach(img => observer.observe(img));
            });

            document.querySelectorAll('.place-dot-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const dotsWrap = btn.closest('.place-dots');
                    const cIdx = parseInt(dotsWrap.dataset.cat, 10);
                    const oIdx = parseInt(btn.dataset.idx, 10);
                    const scrollEl = document.querySelector(`.place-image-scroll[data-cat="${cIdx}"]`);
                    const img = scrollEl ? scrollEl.querySelectorAll('img')[oIdx] : null;
                    if (img) img.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
                });
            });
        }

        function updateUI(lang) {

            const selectEl = document.getElementById('lang-select');

            document.getElementById('chat-box').innerHTML = `
                <div class="flex items-start">

                </div>
            `;

            try { localStorage.setItem('agh_preferred_lang', lang); } catch (e) { /* private browsing κλπ. - αγνοείται */ }

        // 🚀 ΦΩΝΗ: Google Translate TTS πρώτα (πιο φυσικός ήχος),
        // με αυτόματο fallback στη φωνή του browser αν αποτύχει.
        function speakWithBrowser(cleanText) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(cleanText);

            const langMap = { el: 'el', en: 'en', fr: 'fr', de: 'de', es: 'es', it: 'it', zh: 'zh', ja: 'ja', ru: 'ru' };
            const voice = getBestVoice(langMap[currentLang] || 'el');
            if (voice) utterance.voice = voice;
            utterance.lang = { el: 'el-GR', en: 'en-US', fr: 'fr-FR', de: 'de-DE', es: 'es-ES', it: 'it-IT', zh: 'zh-CN', ja: 'ja-JP', ru: 'ru-RU' }[currentLang] || 'el-GR';
            
            utterance.rate = 0.95;   // ελαφρώς πιο αργά από το default -> πιο φυσικό
            utterance.pitch = 1.05;  // ελαφρώς πιο ψηλός τόνος -> πιο γλυκιά/ζεστή χροιά
            
            window.speechSynthesis.speak(utterance);
        }

        // Φωνητική διόρθωση αγγλικών όρων που δεν προφέρονται σωστά από την ελληνική φωνή TTS
        function fixSpeechPronunciation(text, lang) {
            // Ομαδοποίηση μεγάλων αριθμών (π.χ. κωδικός Wi-Fi, τηλέφωνα - ακόμα κι αν έχουν
            // ενδιάμεση παύλα) ανά ΔΥΟ ψηφία, ώστε το TTS να τα διαβάζει φυσικά
            // (π.χ. "22, 17, 08, 11") αντί είτε σαν έναν τεράστιο αριθμό, είτε "συλλαβιστά"
            // ψηφίο-ψηφίο. Ισχύει σε όλες τις γλώσσες.
            text = text.replace(/\d[\d-]{2,}\d/g, (match) => {
                const digitsOnly = match.replace(/[^\d]/g, '');
                return (digitsOnly.match(/\d{1,2}/g) || []).join(', ');
            });

            if (lang !== 'el') return text;
            return text
                .replace(/check-?in/gi, 'τσέκ ιν')
                .replace(/check-?out/gi, 'τσέκ άουτ');
        }

        // Χωρίζει ένα μεγάλο κείμενο σε φυσικά κομμάτια (ολόκληρες προτάσεις, όχι κομμένες λέξεις),
        // κάθε ένα μέχρι ~180 χαρακτήρες, ώστε το Google TTS να τα διαβάζει καθαρά ένα-ένα.
        function splitIntoSpeechChunks(text, maxLen = 180) {
            const sentences = text.match(/[^.!?;\n]+[.!?;\n]*/g) || [text];
            const chunks = [];
            let current = '';

            for (const s of sentences) {
                if (current && (current.length + s.length) > maxLen) {
                    chunks.push(current.trim());
                    current = s;
                } else {
                    current += s;
                }
            }
            if (current.trim()) chunks.push(current.trim());
            return chunks;
        }

        // Παίζει διαδοχικά μια λίστα κομματιών κειμένου μέσω Google TTS, το ένα μετά το άλλο.
        function playSpeechChunks(chunks, index, fullTextForFallback) {
            if (index >= chunks.length) return;

            let langCode = { el: 'el', en: 'en', fr: 'fr', de: 'de', es: 'es', it: 'it', zh: 'zh-CN', ja: 'ja', ru: 'ru' }[currentLang] || 'el';
            let url = `https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=${langCode}&q=${encodeURIComponent(chunks[index])}`;

            sharedAudio.pause();
            sharedAudio.src = url;
            sharedAudio.load();

            sharedAudio.onended = () => playSpeechChunks(chunks, index + 1, fullTextForFallback);
            sharedAudio.onerror = () => {
                if (index === 0) speakWithBrowser(fullTextForFallback);
            };

            const playPromise = sharedAudio.play();
            if (playPromise !== undefined) {
                playPromise.catch(() => { if (index === 0) speakWithBrowser(fullTextForFallback); });
            }
        }

        function speak(text, source = null) {
            let cleanText = text.replace(/<[^>]*>/g, '').replace(/\*\*/g, '').trim();
            if (!cleanText) return;
            cleanText = fixSpeechPronunciation(cleanText, currentLang);

            // Το ElevenLabs (φυσική φωνή, χρεώνεται ανά χαρακτήρα) χρησιμοποιείται ΜΟΝΟ για τις
            // απαντήσεις του Varnavas_Chat.ai. Οι έτοιμες κατηγορίες μας (wifi, κανόνες, ταξί, κλπ.)
            // συνεχίζουν να ακούγονται δωρεάν, χωρίς κατανάλωση χαρακτήρων.
            if (source === 'varnavas') {
                speakWithElevenLabs(cleanText);
            } else {
                speakFallback(cleanText);
            }
        }

        // Κύρια φωνή: ElevenLabs (φυσική, ανθρώπινη), μέσω του κρυφού backend μας (/api/speak).
        // Αν αποτύχει για οποιονδήποτε λόγο (π.χ. εξαντλημένο όριο χαρακτήρων, χωρίς internet),
        // πέφτουμε αυτόματα στο παλιό, δωρεάν σύστημα - ποτέ δεν μένει σιωπηλός ο επισκέπτης.
        async function speakWithElevenLabs(cleanText) {
            try {
                const response = await fetch('/api/speak', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: cleanText })
                });

                if (!response.ok) {
                    const errBody = await response.json().catch(() => ({}));
                    console.error('ElevenLabs error - status:', response.status, '| detail:', errBody.detail || errBody.error);
                    throw new Error('bad status: ' + response.status);
                }

                const blob = await response.blob();
                const objectUrl = URL.createObjectURL(blob);

                sharedAudio.pause();
                sharedAudio.src = objectUrl;
                sharedAudio.load();

                sharedAudio.onended = () => URL.revokeObjectURL(objectUrl);
                sharedAudio.onerror = () => { URL.revokeObjectURL(objectUrl); speakFallback(cleanText); };

                const playPromise = sharedAudio.play();
                if (playPromise !== undefined) {
                    playPromise.catch(() => { URL.revokeObjectURL(objectUrl); speakFallback(cleanText); });
                }
            } catch (e) {
                console.error('ElevenLabs TTS error:', e);
                speakFallback(cleanText);
            }
        }

        // Εφεδρικό (δωρεάν) σύστημα φωνής - το ίδιο που δούλευε πριν το ElevenLabs.
        function speakFallback(cleanText) {
            // ΣΗΜΑΝΤΙΚΗ ΔΙΟΡΘΩΣΗ ΓΙΑ iOS: αν το Google TTS αποτύχει, το fallback στη φωνή του
            // browser γινόταν μέσα σε ΑΣΥΓΧΡΟΝΟ callback (onerror/catch) - δηλαδή εκτός της αρχικής
            // χειρονομίας του χρήστη. Το iOS Safari αρνείται σιωπηλά να μιλήσει σε αυτή την περίπτωση
            // (το Android/Chrome είναι πιο ανεκτικό, γι' αυτό εκεί δούλευε). Λύση: στο iOS πηγαίνουμε
            // ΑΠΕΥΘΕΙΑΣ και ΣΥΓΧΡΟΝΑ στη φωνή συστήματος, μέσα στην ίδια τη χειρονομία.
            if (isIOS) {
                speakWithBrowser(cleanText);
                return;
            }
            const chunks = splitIntoSpeechChunks(cleanText);
            playSpeechChunks(chunks, 0, cleanText);
        }

        function appendMessage(text, isUser = false, source = null) {
            const chatBox = document.getElementById('chat-box'); if (!chatBox) return;

            const messageWrapper = document.createElement('div');
            messageWrapper.className = isUser ? 'flex items-start justify-end' : 'flex flex-col items-start gap-1';

            const bubbleClass = isUser ? 'bg-[#4A5D23] text-white text-sm p-3.5 rounded-2xl rounded-tr-none max-w-[85%] shadow-sm' : 'bg-slate-100 text-slate-800 text-sm p-3.5 rounded-2xl rounded-tl-none max-w-[85%] shadow-sm leading-relaxed';
            
            // Το κείμενο του χρήστη περνάει πάντα από escapeHtml (προστασία από XSS).
            // Οι απαντήσεις του bot προέρχονται από τη δική μας βάση δεδομένων και είναι ασφαλείς.
            const safeText = isUser ? escapeHtml(text) : text;

            if (isUser) {
                messageWrapper.innerHTML = `<div class="${bubbleClass}"><div>${safeText}</div></div>`;
            } else {
                // Όταν η απάντηση έρχεται από το ζωντανό AI fallback (όχι από τις έτοιμες
                // κατηγορίες μας), δείχνουμε καθαρά μια ταμπέλα "🤖 Varnavas_Chat.ai" πάνω
                // από τη φούσκα, ώστε ο επισκέπτης να ξέρει ότι απάντησε ο "ελεύθερος" βοηθός.
                const labelHtml = source === 'varnavas'
                    ? `<span class="text-[10px] font-bold text-[#4A5D23] ml-1">🤖 Varnavas_Chat.ai</span>`
                    : '';
                
                // ΣΗΜΑΝΤΙΚΟ ΓΙΑ iOS SAFARI: το autoplay ήχου μέσω setTimeout μπλοκάρεται μερικές φορές
                // ακόμα κι όταν το audio έχει "ξεκλειδωθεί". Το κουμπί 🔊 είναι ΑΜΕΣΟ πάτημα χρήστη,
                // άρα το iOS ΠΑΝΤΑ επιτρέπει την αναπαραγωγή όταν ξεκινά από εκεί - 100% αξιόπιστο fallback.
                messageWrapper.innerHTML = `
                    ${labelHtml}
                    <div class="flex items-start gap-1.5 w-full">
                        <div class="${bubbleClass}"><div>${safeText}</div></div>
                        <button aria-label="Άκουσε ξανά" title="Άκουσε ξανά" type="button" class="replay-voice-btn shrink-0 w-8 h-8 mt-0.5 rounded-full bg-slate-100 hover:bg-[#4A5D23]/10 text-slate-500 hover:text-[#4A5D23] flex items-center justify-center text-sm transition">🔊</button>
                    </div>
                `;

                const replayBtn = messageWrapper.querySelector('.replay-voice-btn');
                if (replayBtn) {
                    replayBtn.addEventListener('click', () => {
                        unlockSpeech();
                        speak(text, source);
                    });
                }
            }

            chatBox.appendChild(messageWrapper);
            chatBox.scrollTop = chatBox.scrollHeight;

            if (!isUser) speak(text, source);
        }

        function showTyping() {
            const chatBox = document.getElementById('chat-box'); if (!chatBox) return;
            const wrapper = document.createElement('div');
            wrapper.id = 'typing-indicator';
            wrapper.className = 'flex items-start';
            wrapper.innerHTML = `<div class="bg-slate-100 text-slate-400 text-sm px-4 py-3.5 rounded-2xl rounded-tl-none shadow-sm flex gap-1">
                <span class="w-1.5 h-1.5 bg-slate-400 rounded-full typing-dot"></span>
                <span class="w-1.5 h-1.5 bg-slate-400 rounded-full typing-dot"></span>
                <span class="w-1.5 h-1.5 bg-slate-400 rounded-full typing-dot"></span>
            </div>`;
            chatBox.appendChild(wrapper);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function hideTyping() {
            const el = document.getElementById('typing-indicator');
            if (el) el.remove();
        }

        // 🚀 ΑΠΟΤΟΝΙΣΤΗΣ: Δεν κολλάει ποτέ από κεφαλαία ή τόνους
        async function handleAIResponse(userText) {
            try {
                const cleanText = userText.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
                const data = db[currentLang];
                
                const check = (keys) => keys.some(kw => cleanText.includes(kw.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase()));

                if (check(data.keywords.wifi)) return data.wifi;
                if (check(data.keywords.food)) return data.food;
                if (check(data.keywords.beach)) return data.beach;
                if (check(data.keywords.weather)) return { text: data.weather.text.replace('{temp}', liveTemperature) };
                if (check(data.keywords.events)) return data.events;
                if (check(data.keywords.rules)) return data.rules;
                if (check(data.keywords.taxi)) return data.taxi;
                if (check(data.keywords.excursion)) return data.excursion;
                if (check(data.keywords.nightlife)) return data.nightlife;
                if (check(data.keywords.hiking)) return data.hiking;

                // Καμία αντιστοίχιση στις έτοιμες κατηγορίες μας -> ζωντανή απάντηση AI
                // μέσω του δικού μας ασφαλούς proxy (/api/ask). ΚΑΝΕΝΑ API key δεν υπάρχει
                // ή στέλνεται από αυτόν τον client-side κώδικα.
                return await askLiveAI(userText);
            } catch (e) {
                console.error("Parse Error:", e);
                return { text: db[currentLang].failMessage };
            }
        }

        // 🚀 ΖΩΝΤΑΝΗ ΑΠΑΝΤΗΣΗ AI (fallback): καλεί το δικό μας Cloudflare Pages Function
        // (/api/ask), το οποίο κρατά το πραγματικό API key κρυφό στον server. Αν αποτύχει
        // για οποιονδήποτε λόγο (server down, χωρίς internet, δεν έχει ρυθμιστεί ακόμα το
        // key), επιστρέφει απλά το τυπικό μήνυμα άγνοιας - ποτέ δεν σπάει η εμπειρία χρήστη.
        async function askLiveAI(userText) {
            try {
                const response = await fetch('/api/ask', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: userText, lang: currentLang })
                });

                const data = await response.json().catch(() => ({}));
                
                if (!response.ok) {
                    // ΠΡΟΣΩΡΙΝΟ (διάγνωση): δείχνουμε στην κονσόλα το ακριβές μήνυμα του server/Gemini
                    console.error('Live AI error - status:', response.status, '| server detail:', data.error, data.detail);
                    throw new Error('bad status: ' + response.status);
                }
                
                if (data && data.reply && data.reply.trim()) {
                    return { text: data.reply.trim(), source: 'varnavas' };
                }
                
                throw new Error('empty reply');
            } catch (e) {
                console.error('Live AI error:', e);
                return { text: db[currentLang].failMessage };
            }
        }

        function setInputBusy(busy) {
            const inputEl = document.getElementById('chat-input');
            const sendBtnEl = document.getElementById('send-btn');
            inputEl.disabled = busy;
            sendBtnEl.disabled = busy;
        }

        async function sendMessage() {
            unlockSpeech();
            const inputEl = document.getElementById('chat-input');
            const msg = inputEl.value.trim();
            if (!msg) return;

            appendMessage(msg, true);
            inputEl.value = '';
            setInputBusy(true);
            showTyping();

            const startedAt = Date.now();
            const reply = await handleAIResponse(msg);
            
            // Ελάχιστη καθυστέρηση 550ms ΜΟΝΟ αν η απάντηση ήταν στιγμιαία (τοπική αντιστοίχιση),
            // ώστε να μοιάζει φυσικό. Αν χρειάστηκε δίκτυο (ζωντανό AI), δεν προσθέτουμε καθυστέρηση.
            const remaining = 550 - (Date.now() - startedAt);
            if (remaining > 0) await new Promise(r => setTimeout(r, remaining));
            
            hideTyping();
            appendMessage(reply.text, false, reply.source);
            setInputBusy(false);
            
            inputEl.focus();
        }

        window.triggerQuickAction = function(actionType) {
            unlockSpeech();
            const data = db[currentLang]; let tagText = ""; let replyText = "";
            if (actionType === 'weather') { tagText = data.tags.weather; replyText = data.weather.text.replace('{temp}', liveTemperature); }
            else if (actionType === 'events') { tagText = data.tags.events; replyText = data.events.text; }
            else if (actionType === 'rules') { tagText = data.tags.rules; replyText = data.rules.text; }
            else if (actionType === 'taxi') { tagText = data.tags.taxi; replyText = data.taxi.text; }
            
            appendMessage(tagText, true);
            setInputBusy(true);
            showTyping();
            setTimeout(() => {
                hideTyping();
                appendMessage(replyText, false);
                setInputBusy(false);
            }, 550);
        }

        window.addEventListener('DOMContentLoaded', () => {
            const chatInputEl = document.getElementById('chat-input');
            const sendBtnEl = document.getElementById('send-btn');
            const langSelectEl = document.getElementById('lang-select');

            langSelectEl.addEventListener('change', (e) => { updateUI(e.target.value); });
            sendBtnEl.addEventListener('click', sendMessage);
            chatInputEl.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

            const voiceBtnEl = document.getElementById('voice-btn');
            voiceBtnEl.addEventListener('click', () => {
                unlockSpeech();
                try {
                    const SpeechRecognition = window.webkitSpeechRecognition || window.SpeechRecognition;
                    if (SpeechRecognition) {
                        const recognition = new SpeechRecognition();
                        recognition.interimResults = false;
                        let voiceLang = { el: 'el-GR', en: 'en-US', fr: 'fr-FR', de: 'de-DE', es: 'es-ES', it: 'it-IT', zh: 'zh-CN', ja: 'ja-JP', ru: 'ru-RU' }[currentLang] || 'en-US';
                        recognition.lang = voiceLang;
                        
                        recognition.onstart = () => {
                            voiceBtnEl.classList.add('bg-red-100', 'text-red-600', 'animate-pulse');
                            chatInputEl.placeholder = db[currentLang].listening;
                        };
                        
                        recognition.onresult = (event) => {
                            chatInputEl.value = event.results[0][0].transcript;
                            sendMessage();
                        };
                        
                        recognition.onend = () => {
                            voiceBtnEl.classList.remove('bg-red-100', 'text-red-600', 'animate-pulse');
                            chatInputEl.placeholder = db[currentLang].placeholder;
                        };
                        
                        recognition.onerror = () => {
                            voiceBtnEl.classList.remove('bg-red-100', 'text-red-600', 'animate-pulse');
                            chatInputEl.placeholder = db[currentLang].placeholder;
                        };
                        
                        recognition.start();
                    } else {
                        alert("Speech recognition is blocked inside Viber/WhatsApp in-app browsers. Please open this page in Chrome or Safari!");
                    }
                } catch (error) {
                    alert("Please open the page in Chrome or Safari to use voice commands!");
                }
            });

            // Επαναφορά της προηγούμενης προτίμησης γλώσσας του επισκέπτη (αν υπάρχει)
            let initialLang = 'el';
            try {
                const saved = localStorage.getItem('agh_preferred_lang');
                if (saved && db[saved]) initialLang = saved;
            } catch (e) { /* private browsing κλπ. - αγνοείται */ }
            
            langSelectEl.value = initialLang;
            updateUI(initialLang);

            fetchLiveWeather();
            // Ανανέωση καιρού κάθε 15 λεπτά ώστε η θερμοκρασία να μένει ενημερωμένη
            setInterval(fetchLiveWeather, 15 * 60 * 1000);
        });
    </script>
</body>
</html>
